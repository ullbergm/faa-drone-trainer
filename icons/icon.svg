  <circle cx="152" cy="152" r="58" fill="none" stroke="#ffffff" stroke-width="20"/>
  <circle cx="360" cy="152" r="58" fill="none" stroke="#ffffff" stroke-width="20"/>
  <circle cx="152" cy="360" r="58" fill="none" stroke="#ffffff" stroke-width="20"/>
  <circle cx="360" cy="360" r="58" fill="none" stroke="#ffffff" stroke-width="20"/>
  <line x1="188" y1="188" x2="238" y2="238" stroke="#ffffff" stroke-width="26"/>
  <line x1="324" y1="188" x2="274" y2="238" stroke="#ffffff" stroke-width="26"/>
  <line x1="188" y1="324" x2="238" y2="274" stroke="#ffffff" stroke-width="26"/>
  <line x1="324" y1="324" x2="274" y2="274" stroke="#ffffff" stroke-width="26"/>
  <rect x="212" y="212" width="88" height="88" rx="22" fill="#ffffff"/>
  <circle cx="256" cy="256" r="17" fill="#145e9e"/>
  <circle cx="152" cy="152" r="15" fill="#ffffff"/>
  <circle cx="360" cy="152" r="15" fill="#ffffff"/>
